<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Darlan Schwartz — Software Engineer and Game Developer">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.15" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.9" cy="1" r="0.6">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#0D11170D" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="300" rx="20"/></clipPath>
  </defs>
  <style>
    .t { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'Cascadia Code', 'JetBrains Mono', Consolas, 'SFMono-Regular', Menlo, monospace; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  </style>
  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="#FFFFFF"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <rect width="1200" height="300" fill="url(#glowA)"/>
    <rect width="1200" height="300" fill="url(#glowB)"/>
    <rect y="294" width="1200" height="6" fill="url(#accent)"/>
  </g>
  <text x="80" y="104" class="mono" font-size="22" fill="url(#accent)">&gt; hello world, I'm</text>
  <text x="76" y="178" class="t" font-size="76" font-weight="700" fill="#1F2328">Darlan Schwartz</text>
  <text x="80" y="226" class="t" font-size="28" fill="#59636E">Software Engineer · Game Developer<tspan class="cursor" fill="#06B6D4"> _</tspan></text>
  <g class="mono" font-size="17" text-anchor="middle">
    <rect x="868" y="74" width="132" height="38" rx="19" fill="#0D11170F"/><text x="934" y="99" fill="#1F2328">C#</text>
    <rect x="1012" y="74" width="132" height="38" rx="19" fill="#0D11170F"/><text x="1078" y="99" fill="#1F2328">TypeScript</text>
    <rect x="868" y="124" width="132" height="38" rx="19" fill="#0D11170F"/><text x="934" y="149" fill="#1F2328">Unity</text>
    <rect x="1012" y="124" width="132" height="38" rx="19" fill="#0D11170F"/><text x="1078" y="149" fill="#1F2328">.NET</text>
    <rect x="868" y="174" width="132" height="38" rx="19" fill="#0D11170F"/><text x="934" y="199" fill="#1F2328">React</text>
    <rect x="1012" y="174" width="132" height="38" rx="19" fill="#0D11170F"/><text x="1078" y="199" fill="#1F2328">Node.js</text>
  </g>
</svg>
